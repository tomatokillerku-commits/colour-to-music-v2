<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>架构图预览 — 颜色→音乐</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 80px;
    background: #0b0c12;
    font-family: Inter, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: #e6ebf4;
  }
  .wrap { max-width: 1440px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 28px;
    padding-bottom: 18px; border-bottom: 1px solid rgba(201,168,76,.2);
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: .5px; }
  .sub { font-size: 12px; color: #7a8090; letter-spacing: 1px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 9px 16px; font-size: 12px; letter-spacing: .6px;
    background: transparent; color: #c9a84c;
    border: 1px solid rgba(201,168,76,.45); border-radius: 4px;
    cursor: pointer; font-family: inherit;
    transition: background .2s, border-color .2s;
  }
  button:hover { background: rgba(201,168,76,.1); border-color: rgba(201,168,76,.8); }

  .canvas {
    background: #07080e; border-radius: 8px; padding: 12px;
    border: 1px solid rgba(255,255,255,.06);
    overflow-x: auto;
  }
  .canvas img { display: block; width: 100%; min-width: 1100px; height: auto; }

  .hint {
    margin-top: 16px; font-size: 11.5px; color: #5a6070; line-height: 1.8;
  }
  .hint code {
    background: rgba(255,255,255,.05); padding: 2px 7px;
    border-radius: 3px; color: #9ec5de; font-size: 11px;
  }

  .section { margin-top: 56px; }
  .section h2 {
    font-size: 13px; font-weight: 500; color: #c9a84c;
    letter-spacing: 2px; text-transform: uppercase;
    padding-bottom: 12px; margin-bottom: 24px;
    border-bottom: 1px solid rgba(201,168,76,.16);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>颜色 → 音乐 · 系统架构图</h1>
      <div class="sub">Colour → Music · Dual-Channel Architecture</div>
    </div>
    <div class="actions">
      <button onclick="downloadSVG()">下载 SVG（矢量）</button>
      <button onclick="downloadPNG(2)">下载 PNG @2x</button>
      <button onclick="downloadPNG(4)">下载 PNG @4x（印刷级）</button>
    </div>
  </header>

  <div class="canvas">
    <img id="arch" src="architecture.svg" alt="系统架构图">
  </div>

  <p class="hint">
    <b style="color:#8f97a6">用法建议</b><br>
    · <code>SVG</code> 矢量格式，可无限放大，适合嵌入网页作品集或 Figma<br>
    · <code>PNG @2x</code> = 2800×2360，适合屏幕展示<br>
    · <code>PNG @4x</code> = 5600×4720，适合打印 / 答辩大屏<br>
    · 原图尺寸 1400×1180，配色与你的网页一致（深底 #07080e + 金 #c9a84c）
  </p>

  <div class="section">
    <h2>导出为高清 PNG</h2>
    <p class="hint" style="margin:0">
      点击上方按钮会自动导出。若需要其他尺寸，可在浏览器控制台执行：
      <code>exportPNG(3)</code>（3 倍 = 4200×3540）
    </p>
  </div>

</div>

<script>
function downloadSVG() {
  const a = document.createElement('a');
  a.href = 'architecture.svg';
  a.download = 'architecture.svg';
  a.click();
}

function downloadPNG(scale) {
  exportPNG(scale);
}

function exportPNG(scale = 2) {
  const img = document.getElementById('arch');
  const W = 1400, H = 1180;
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');

  // 深色底(与 SVG 背景一致)
  ctx.fillStyle = '#07080e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(function (blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `architecture@${scale}x.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
}
</script>
</body>
</html>
